<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bowel 移动端设计</title>
<style>
@font-face { font-family: "OPPO Sans 4.0"; src: url("../resources/fonts/OPPOSans4.0.ttf"); font-weight: 100 900; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #e7e4dc; color: #1c1b19; font: 14px/1.5 "OPPO Sans 4.0", "PingFang SC", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }

/* ---- the review page ---- */
.bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding: 12px 40px; background: rgba(231,228,220,.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(28,27,25,.1); }
.bar h1 { font-size: 16px; margin: 0 8px 0 0; }
.ctl { display: flex; align-items: center; gap: 6px; }
.ctl > span { color: #5f5b52; font-size: 12px; margin-right: 2px; }
.ctl button { padding: 5px 11px; border-radius: 8px; font-size: 13px; min-height: 32px; }
.ctl button:hover { background: rgba(28,27,25,.07); }
.ctl button.on { background: #1c1b19; color: #f6f4ef; }
main { padding: 8px 28px 80px; }
section { margin-top: 44px; }
section > h2 { font-size: 22px; margin: 0 0 4px; }
section > p { margin: 0 0 22px; color: #5f5b52; max-width: 760px; }
.row { display: flex; flex-wrap: wrap; gap: 28px 16px; align-items: flex-start; }
figure { margin: 0; }
figcaption { margin-top: 12px; width: 390px; color: #5f5b52; font-size: 13px; }
figcaption b { color: #1c1b19; font-weight: 600; }
table { border-collapse: collapse; width: 100%; max-width: 980px; background: #f6f4ef; border-radius: 12px; overflow: hidden; }
th, td { text-align: left; padding: 11px 16px; border-bottom: 1px solid rgba(28,27,25,.08); vertical-align: top; }
th { font-size: 12px; color: #5f5b52; font-weight: 500; }
tr:last-child td { border-bottom: 0; }

/* ---- the phone ---- */
.phone { position: relative; width: 390px; height: 844px; border-radius: 48px; overflow: hidden; box-shadow: 0 0 0 9px #17161a, 0 24px 50px -18px rgba(0,0,0,.45); margin: 9px; background: var(--paper); color: var(--ink); font-family: var(--font); isolation: isolate; }
.phone[data-os=android] { border-radius: 30px; }
.phone::after { content: ""; position: absolute; top: 12px; left: 50%; translate: -50% 0; width: 118px; height: 34px; border-radius: 20px; background: #000; z-index: 40; pointer-events: none; }
.phone[data-os=android]::after { width: 22px; height: 22px; top: 12px; }
.deco { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
.deco[data-k=phosphor] { background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55)), repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px); }
.deco[data-k=broadsheet] { background: radial-gradient(ellipse at center, transparent 58%, rgba(90,60,20,.16)); }
.deco[data-k=neon] { background: linear-gradient(90deg, var(--r-media), var(--r-default)) top/100% 2px no-repeat, radial-gradient(circle at 8% 5%, color-mix(in srgb, var(--r-media) 17%, transparent), transparent 55%), radial-gradient(circle at 95% 98%, color-mix(in srgb, var(--r-default) 14%, transparent), transparent 55%); }
.deco[data-k=blueprint] { background: linear-gradient(rgba(240,247,255,.1) 1px, transparent 1px) 0 0/80px 80px, linear-gradient(90deg, rgba(240,247,255,.1) 1px, transparent 1px) 0 0/80px 80px, linear-gradient(rgba(240,247,255,.045) 1px, transparent 1px) 0 0/16px 16px, linear-gradient(90deg, rgba(240,247,255,.045) 1px, transparent 1px) 0 0/16px 16px; }
.deco[data-k=sakura] { background: radial-gradient(circle at 92% 2%, color-mix(in srgb, var(--r-media) 15%, transparent), transparent 52%); }
.deco svg { position: absolute; inset: 0; width: 100%; height: 100%; }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding-top: 58px; }
.phone[data-os=android] .screen { padding-top: 46px; }
.page { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.px { padding-left: 16px; padding-right: 16px; }

.top { display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 16px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: calc(var(--round) * 15px); background: var(--paper2); font-weight: 600; font-size: 14px; }
.pill small { font-weight: 400; font-size: 12.5px; color: var(--mute); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.dot.off { background: var(--mute); } .dot.err { background: var(--signal); } .dot.warn { background: var(--warn); }
.sw { position: relative; display: block; width: 58px; height: 34px; border-radius: calc(var(--round) * 17px); background: var(--faint); transition: background .18s; flex: none; }
.sw i { position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: calc(var(--round) * 14px); background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .18s; }
.sw.on { background: var(--accent); box-shadow: var(--lit); } .sw.on i { left: 27px; }
.swbox { display: flex; align-items: center; min-height: 44px; }

.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--mute); font-weight: 500; }
.disp { font-family: var(--disp); text-shadow: var(--glow); }
.news { display: flex; align-items: center; gap: 10px; margin: 2px 16px 0; padding: 7px 8px 7px 12px; border-radius: calc(var(--round) * 10px); background: color-mix(in srgb, var(--signal) 13%, var(--paper)); font-size: 13.5px; }
.news b { color: var(--signal-t); }
.news span { flex: 1; }
.hero { padding: 6px 16px 0; flex: none; }
.exit { display: flex; align-items: center; gap: 11px; margin-top: 2px; min-height: 46px; max-width: 100%; }
.exit-name { font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flag { display: inline-block; border-radius: 50%; overflow: hidden; flex: none; vertical-align: -3px; outline: 1px solid var(--hair); outline-offset: -1px; }
.flag svg { display: block; width: 100%; height: 100%; }
.flag.none { border: 1.5px dashed var(--mute); }
.meta { color: var(--ink2); font-size: 13.5px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.tag { font-size: 11.5px; font-weight: 600; padding: 0 5px; line-height: 18px; border-radius: calc(var(--round) * 5px); background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good-t); }
.tag.name { background: color-mix(in srgb, var(--mute) 16%, transparent); color: var(--mute); }
.tag.unknown { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn-t); }
.lat { display: flex; align-items: center; gap: 10px; margin-top: 5px; min-height: 46px; }
.ms { font-size: 32px; font-weight: 700; color: var(--good-t); font-family: var(--disp); line-height: 1; text-shadow: var(--glow); }
.ms small { font-size: 13px; font-weight: 400; color: var(--mute); margin-left: 2px; }
.bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; }
.bars i { width: 3px; background: var(--ink2); opacity: .75; }
.grow { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 40px; padding: 0 14px; border-radius: calc(var(--round) * 20px); font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn.acc, .btn.acc-b { background: var(--accent); color: var(--on-accent); box-shadow: var(--lit); }
.btn.out { box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn.quiet { background: var(--paper2); }
.btn.big { width: 100%; min-height: 52px; font-size: 16px; }
.btn.danger { color: var(--signal-t); }
.seg { display: flex; padding: 3px; gap: 2px; border-radius: calc(var(--round) * 11px); background: var(--paper2); }
.seg button { flex: 1; min-height: 38px; text-align: center; border-radius: calc(var(--round) * 8px); font-size: 14px; color: var(--ink2); font-weight: 500; position: relative; white-space: nowrap; }
.seg button.on { background: var(--seg-on); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.phone { --bar: 92px; }
.phone[data-os=android] { --bar: 86px; }
.tab-slot { flex: none; height: var(--bar); position: relative; z-index: 40; }
.tabs { position: absolute; left: 0; right: 0; bottom: 0; display: flex; }
.tabs button { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.tabs .ti { position: relative; z-index: 1; display: grid; place-items: center; }
.tabs .ti svg { width: 24px; height: 24px; fill: currentColor; }
.tabs .lb { position: relative; z-index: 1; white-space: nowrap; }
.tabs .pip { position: absolute; top: 1px; right: -3px; width: 8px; height: 8px; background: var(--warn); border-radius: 50%; }
.tab-pill { position: absolute; display: block; }

/* iOS: the system tab bar. Glass, type and shape are the system's; a skin only sets the tint. */
.phone[data-os=ios] .tabs { left: 21px; right: 21px; bottom: 21px; height: 62px; padding: 4px; border-radius: 31px; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  color: rgba(0,0,0,.74); background: rgba(255,255,255,.5); -webkit-backdrop-filter: blur(14px) saturate(1.8); backdrop-filter: blur(14px) saturate(1.8);
  box-shadow: inset 0 0 0 .5px rgba(255,255,255,.75), inset 0 1px 1.5px rgba(255,255,255,.8), inset 0 -1px 2px rgba(255,255,255,.3), 0 0 0 .5px rgba(0,0,0,.05), 0 10px 26px -10px rgba(0,0,0,.28); }
.phone[data-os=ios][data-glass=dark] .tabs { color: rgba(255,255,255,.84); background: rgba(44,44,48,.46);
  box-shadow: inset 0 0 0 .5px rgba(255,255,255,.2), inset 0 1px 1.5px rgba(255,255,255,.22), 0 0 0 .5px rgba(0,0,0,.3), 0 10px 26px -10px rgba(0,0,0,.6); }
.phone[data-os=ios] .tabs .ti { height: 27px; }
.phone[data-os=ios] .tabs .lb { font-size: 10.5px; line-height: 13px; font-weight: 500; }
.phone[data-os=ios] .tabs button.on { color: color-mix(in srgb, var(--accent) 76%, #000); }
.phone[data-os=ios][data-glass=dark] .tabs button.on { color: color-mix(in srgb, var(--accent) 66%, #fff); }
.phone[data-os=ios] .tab-pill { inset: 0; border-radius: 27px; background: rgba(0,0,0,.07); }
.phone[data-os=ios][data-glass=dark] .tab-pill { background: rgba(255,255,255,.13); }

/* Android: Material 3 navigation bar, drawn by Flutter, so it follows the skin. */
.phone[data-os=android] .tabs { padding: 10px 8px 24px; background: var(--card); color: var(--ink2); box-shadow: 0 -1px 0 var(--hair2); }
.phone[data-os=android] .tabs button { justify-content: flex-start; gap: 3px; }
.phone[data-os=android] .tabs .ti { height: 32px; }
.phone[data-os=android] .tabs .lb { font-size: 12px; line-height: 16px; font-weight: 500; }
.phone[data-os=android] .tabs button.on { color: var(--ink); }
.phone[data-os=android] .tabs button.on .lb { font-weight: 700; }
.phone[data-os=android] .tab-pill { top: 0; left: 50%; translate: -50% 0; width: 64px; height: 32px; border-radius: calc(var(--round) * 16px); background: color-mix(in srgb, var(--accent) 34%, transparent); }

/* On iOS the list runs under the floating glass; search and add float above it. */
.phone[data-os=ios]:not([data-tab=home]) .content { margin-bottom: calc(var(--bar) * -1); }
.phone[data-os=ios] .page { position: relative; }
.phone[data-os=ios] .scroll { padding-bottom: calc(var(--bar) + 10px); }
.phone[data-os=ios] .page:has(.dock) .scroll { padding-bottom: calc(var(--bar) + 66px); }
.phone[data-os=ios] .page:has(.dock .chips) .scroll { padding-bottom: calc(var(--bar) + 116px); }
.phone[data-os=ios] .page:has(.dock)::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--bar) + 86px); z-index: 3; pointer-events: none; background: linear-gradient(to bottom, color-mix(in srgb, var(--paper) 0%, transparent), var(--paper) 42%, color-mix(in srgb, var(--paper) 72%, transparent)); }
.phone[data-os=ios] .page:has(.dock .chips)::after { height: calc(var(--bar) + 136px); }

.ptitle { font-size: 30px; font-weight: 700; line-height: 1.2; }
.field { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: calc(var(--round) * 11px); background: var(--paper2); }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 14.5px; }
.field input::placeholder, textarea::placeholder { color: var(--mute); }
.icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 16px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; min-height: 36px; padding: 0 12px; border-radius: calc(var(--round) * 18px); font-size: 13.5px; color: var(--ink2); white-space: nowrap; flex: none; }
.chip.on { background: var(--ink); color: var(--paper); font-weight: 600; }
.line { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 62px; padding: 8px 16px; border-bottom: 1px solid var(--hair2); }
.line .main { flex: 1; min-width: 0; }
.line .t { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.line .s { font-size: 12.5px; color: var(--mute); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.line .s .sq { margin-right: 4px; vertical-align: 1px; }
.line .r { text-align: right; font-size: 13.5px; white-space: nowrap; }
.line.sel { background: var(--hover); }
.line .sq { width: 8px; height: 8px; border-radius: calc(var(--round) * 2px); display: inline-block; flex: none; }
.line .app { width: 34px; height: 34px; border-radius: 9px; background: var(--paper2); display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--ink2); flex: none; }
.good { color: var(--good-t); } .warn { color: var(--warn-t); } .bad { color: var(--signal-t); } .mute { color: var(--mute); }

.kv { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--hair2); font-size: 14px; }
.kv span:first-child { width: 72px; color: var(--mute); flex: none; }
.kv span:last-child { flex: 1; min-width: 0; word-break: break-all; }
.group { padding: 18px 16px 4px; }
.set { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--hair2); font-size: 15px; width: 100%; }
.set small { display: block; font-size: 12.5px; color: var(--mute); line-height: 1.35; }
.set .v { color: var(--mute); font-size: 14px; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.skins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 6px; }
.skin { padding: 9px; border-radius: 10px; min-height: 66px; font-size: 13px; font-weight: 600; box-shadow: inset 0 0 0 1px var(--hair); }
.skin.on { box-shadow: inset 0 0 0 2px var(--ink); }
.skin i { display: flex; gap: 3px; margin-bottom: 7px; } .skin i b { width: 11px; height: 11px; border-radius: 3px; }
.usage { height: 5px; border-radius: 3px; background: var(--paper2); overflow: hidden; margin: 6px 0 3px; }
.usage i { display: block; height: 100%; background: var(--ink2); }
.latdots { display: inline-flex; gap: 2px; }
.latdots i { width: 5px; height: 5px; border-radius: 50%; }
.toast { position: absolute; left: 50%; translate: -50% 0; bottom: 104px; background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: calc(var(--round) * 10px); font-size: 13.5px; z-index: 20; white-space: nowrap; }
.setup { padding: 26px 20px 30px; flex: 1; display: flex; flex-direction: column; }
.setup h3 { font-size: 34px; margin: 8px 0 8px; line-height: 1.2; }
.setup p { margin: 0; color: var(--ink2); font-size: 15px; }
textarea { width: 100%; min-height: 128px; border: 0; outline: 0; resize: none; padding: 12px; border-radius: calc(var(--round) * 12px); background: var(--paper2); margin-top: 22px; font-size: 14.5px; }
.pts { margin: 22px 0 0; padding: 0; list-style: none; }
.pts li { padding: 12px 0; border-bottom: 1px solid var(--hair2); font-size: 15px; }
.pts small { display: block; color: var(--mute); font-size: 13px; }

.shim { color: transparent !important; text-shadow: none !important; background: linear-gradient(100deg, var(--ink) 30%, var(--faint) 50%, var(--ink) 70%) 0 0/220% 100%; -webkit-background-clip: text; background-clip: text; animation: shim 1s linear infinite; }
@keyframes shim { to { background-position: -220% 0; } }
.skel { display: inline-block; width: 36px; height: 11px; border-radius: 4px; background: linear-gradient(100deg, var(--paper2) 30%, var(--faint) 50%, var(--paper2) 70%) 0 0/220% 100%; animation: shim 1s linear infinite; }
@media (prefers-reduced-motion: reduce) { .shim, .skel { animation: none; } }

/* ---- glances ---- */
.gl-wrap { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
.gl { width: 170px; height: 170px; border-radius: 26px; padding: 14px; background: var(--paper); color: var(--ink); font-family: var(--font); display: flex; flex-direction: column; box-shadow: 0 6px 18px -8px rgba(0,0,0,.3); position: relative; overflow: hidden; }
.gl.wide { width: 364px; }
.gl-col { display: flex; flex-direction: column; gap: 8px; }
.gl-col > small { color: #5f5b52; font-size: 12.5px; }
.cc { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: #0a84ff; color: #fff; }
.cc.off { background: #3a3a3c; color: #e5e5ea; }
.lock { width: 170px; height: 76px; border-radius: 16px; background: rgba(255,255,255,.2); color: #fff; padding: 10px 12px; font-size: 13px; line-height: 1.35; }
.oswall { background: #2a2d36; border-radius: 20px; padding: 20px; display: flex; gap: 12px; align-items: center; }
.qs { width: 176px; height: 72px; border-radius: 22px; padding: 0 14px; display: flex; align-items: center; gap: 10px; background: #d0e4ff; color: #0b1d36; font-size: 14px; line-height: 1.25; }
.qs.off { background: #3a3d45; color: #e3e3e8; }
.notif { width: 364px; border-radius: 22px; background: #f2f1f6; color: #1c1b1f; padding: 13px 15px; font-size: 13.5px; }
.notif .acts { display: flex; gap: 18px; margin-top: 8px; color: #2a5cb8; font-weight: 600; }

/* ---- the board: one panel of cells, as on the desktop ---- */
:root { --slow: 1; --ease: cubic-bezier(.32,.86,.22,1); }
.content { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.board { position: absolute; left: 0; right: 0; top: 0; overflow: hidden; background: var(--hair); }
.x { width: 44px; height: 44px; display: grid; place-items: center; border-radius: calc(var(--round) * 12px); background: var(--paper2); color: var(--ink2); flex: none; }
.cell { position: absolute; display: block; width: 100%; padding: 0; background: var(--paper); overflow: hidden; text-align: left; cursor: pointer;
  transition: left calc(.56s * var(--slow)) var(--ease), top calc(.56s * var(--slow)) var(--ease), width calc(.56s * var(--slow)) var(--ease), height calc(.56s * var(--slow)) var(--ease), background .2s; }
.cell:not([data-v=expanded]):active { background: color-mix(in srgb, var(--paper) 93%, var(--ink)); }
.cell[data-v=expanded] { background: var(--sheet); cursor: default; --paper2: color-mix(in srgb, var(--ink) 9%, var(--sheet)); }
.no-anim .cell, .no-anim .board { transition: none !important; }
.measuring .vw.entering * { animation: none !important; }
.vw { position: absolute; left: 0; top: 0; visibility: hidden; pointer-events: none; }
.cell[data-v=normal] .v-normal, .cell[data-v=compact] .v-compact, .cell[data-v=expanded] .v-detail { visibility: visible; pointer-events: auto; }
.map-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 25; }

@keyframes drawerIn { from { clip-path: inset(0 0 100% 0); transform: translateY(-6px); } to { clip-path: inset(0 0 0 0); transform: none; } }
@keyframes drawerOut { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 0 100% 0); transform: translateY(-6px); } }
.vw.entering :is(.line, .dsec, .rr, .route, .tool, .det-f > *, .hint, .hero-sw, .meta, .lat, .words, .takeline, .spd, .stack, .foot, .aprow, .cmp > *, .li > *, .kicker, .h3, .det-h .seg, .ms-row, .big):not([data-m]) {
  animation: drawerIn calc(.44s * var(--slow)) cubic-bezier(.2,.8,.2,1) both; animation-delay: calc((.1s + var(--i, 0) * 28ms) * var(--slow)); }
.vw.entering :is(.line, .dsec, .rr, .route, .aprow, .ms-row, .cmp > *, .li > *):nth-child(2) { --i: 2; }
.vw.entering :is(.line, .dsec, .rr, .route, .aprow, .ms-row, .cmp > *, .li > *):nth-child(3) { --i: 4; }
.vw.entering :is(.line, .dsec, .rr, .route, .aprow, .ms-row, .cmp > *, .li > *):nth-child(4) { --i: 6; }
.vw.entering :is(.line, .dsec, .rr, .aprow, .ms-row):nth-child(n+5) { --i: 8; }
.vw.leaving { visibility: visible !important; z-index: 1; animation: drawerOut calc(.2s * var(--slow)) cubic-bezier(.4,0,1,1) both; pointer-events: none !important; }

const landBytes = Uint8Array.from(atob(LAND), c => c.charCodeAt(0));
const isLand = (lat, lon) => { const r=Math.floor(90-lat), c=Math.floor(((lon+180)%360+360)%360); if (r<0||r>=180) return false; const i=r*360+c; return (landBytes[i>>3]>>(i&7))&1; };
let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
const STACK = Array.from({length:46},(_,i)=>[.3+rnd()*.35,.05+rnd()*.08,.34+rnd()*.3+(i%19<3?-.2:0),.04]);
const stack = (n=46, kind='') => { const c=STACK.slice(0,n), top=Math.max(...c.map(x=>x.reduce((a,v)=>a+v,0))), h=kind==='big'?72:kind==='mini'?16:40; return `<div class="stack ${kind}" aria-hidden="true">${c.map(x=>`<div>${x.map((v,i)=>`<i style="display:block;height:${(v/top*h).toFixed(1)}px;background:var(--r-${RID[i]})"></i>`).join('')}</div>`).join('')}</div>`; };

}

function latDots(p, ns) {
  const tone = (d) => !d?0:d<130?1:d<220?2:3;

  const shown = all.length>48 ? Array.from({length:48},(_,i)=>all[Math.floor(i*all.length/48)]) : all;
  return `<span class="latdots" style="margin-top:6px">${shown.map(v=>`<i style="background:var(--${v===1?'good':v===2||v===3?'warn':'signal'});opacity:${v===3?.55:1}"></i>`).join('')}</span>`;
}
function provGroup(s, i, f, ns) {
  const key = i+'|'+f, open = !!(s.pgs&&s.pgs[key]), list = ns.slice().sort(byLatency), best = list[0];
  return `<div class="rgrp ${open?'open':''}" data-rg="${key}"><button class="rhead" data-a="pgroup:${key}">${flag(f,20)}<span class="rname">${REGION[f]}</span><span class="rcount">${ns.length}</span><span class="grow"></span><span class="${latClass(best.d)} ms2">${best.d?'最快 '+best.d+' ms':'超时'}</span>${icon('chev','width:15px;height:15px;color:var(--mute)')}</button><div class="acc ${open?'open':''}"><div><div class="rrows">${open?list.map(nrow).join(''):''}</div></div></div></div>`;
}

const later=(ms,fn)=>setTimeout(fn,ms*SLOW);
function fillGroup(g, key) {
  const rows=g.querySelector('.rrows'); if (rows.children.length) return;
  const [i,f]=key.split('|'), list=provNodes(PROVIDERS[+i]).filter(n=>n.f===f).sort(byLatency);
  rows.innerHTML=list.map(nrow).join('');
}
function act(el, s, a, b) {
  const [k,...rest]=a.split(':'); const v=rest.join(':');
  const m=(fn,prep)=>morph(el,()=>{fn();renderOne(el);},prep);
  switch (k) {
    case 'tab': if (s.tab===v) return; m(()=>{s.tab=v;s.x=null;s.sub=null;}); return;
    case 'go': m(()=>{s.tab=v;s.x=null;s.sub=null;}); return;
    case 'x': m(()=>{s.x=v;s.sub=null;s.region='all';s.searching=false;}); return;
    case 'collapse': m(()=>{s.x=null;s.sub=null;}); return;
    case 'sub': m(()=>{s.x='routes';s.sub=v;s.region='all';s.searching=false;}); return;
    case 'subback': m(()=>{s.sub=null;}); return;
    case 'take': s.pending='take'; renderOne(el); later(850,()=>m(()=>{s.on=!s.on;s.issue=false;s.x=null;s.sub=null;s.pending=null;})); return;
    case 'retake': s.pending='take'; renderOne(el); later(850,()=>m(()=>{s.on=true;s.issue=false;s.pending=null;})); return;
    case 'mode': if (s.mode===v) return; m(()=>{s.mode=v;}); return;
    case 'auto': { const r=s.routes.find(x=>x.id===v); r.auto=!r.auto; renderOne(el); return; }
    case 'autoset': { const [rid,val]=v.split('|'); s.routes.find(x=>x.id===rid).auto=val==='1'; renderOne(el); return; }
    case 'region': s.region=v; renderOne(el); return;
    case 'search': s.searching=!s.searching; renderOne(el); return;
    case 'test': s.testing=true; renderOne(el); later(1000,()=>{s.testing=false;renderOne(el);}); return;
    case 'node': { const [rid,n]=v.split('|'); const r=s.routes.find(x=>x.id===rid); if (r.node===n) return;
      m(()=>{r.node=n;r.auto=false;s.pending='node:'+rid;},()=>{ // the tapped name becomes the title
        el.querySelectorAll(`[data-m="exit-${rid}"]`).forEach(e=>e.removeAttribute('data-m'));
        const nm=b.querySelector('.nm'); if (nm) { nm.dataset.m=`exit-${rid}`; el._vc=null; el.querySelectorAll('.cell').forEach(c=>c._vc=null); }
      });
      later(800,()=>{s.pending=null;renderOne(el);}); return; }
    case 'range': s.range=v; renderOne(el); return;
    case 'log': s.log=v; s.open=null; renderOne(el); return;
    case 'filter': s.filter=v; s.open=null; renderOne(el); return;
    case 'conn': {
      const key=k+v, was=s.open===key; s.open=was?null:key;
      el.querySelectorAll('.acc').forEach(x=>x.classList.toggle('open',x.dataset.acc===s.open));
      el.querySelectorAll('.line[data-a]').forEach(x=>x.classList.toggle('opened',x.dataset.a.replace(':','')===s.open));
      return; }
    case 'prov': {
      const key=k+v, was=s.open===key; s.open=was?null:key;
      el.querySelectorAll('.prov').forEach(x=>x.classList.toggle('open',!was&&x.dataset.prov===v));
      el.querySelectorAll('.prov > .acc').forEach(x=>x.classList.toggle('open',x.dataset.acc===s.open));
      const d=el.querySelector('.dock'); if (d) d.outerHTML=provDock(s);
      // closing a long list above can carry this one off screen: bring it back
      if (!was) later(440,()=>{ const sc=el.querySelector('.scroll'), h=el.querySelector(`.prov[data-prov="${v}"]`); if (!sc||!h) return; const dy=h.getBoundingClientRect().top-sc.getBoundingClientRect().top; if (dy<0) sc.scrollTo({top:sc.scrollTop+dy,behavior:'smooth'}); });
      return; }
    case 'pgroup': {
      const g=el.querySelector(`.rgrp[data-rg="${v}"]`); s.pgs=s.pgs||{}; const on=!s.pgs[v]; if (on) s.pgs[v]=1; else delete s.pgs[v];
      fillGroup(g,v); g.classList.toggle('open',on); g.querySelector('.acc').classList.toggle('open',on);
      return; }
    case 'ptest': s.ptesting=true; el.querySelector('.dock').outerHTML=provDock(s); later(1100,()=>{s.ptesting=false; const d=el.querySelector('.dock'); if (d) d.outerHTML=provDock(s);}); return;
    case 'rule': s.open=null; s.toast='已添加规则，走 '+v; renderOne(el); later(1600,()=>{s.toast=null;renderOne(el);}); return;
    case 'setup': if (v==='2') s.setup=2; else { s.setup=0; s.on=v!=='skip'; } renderOne(el); return;
  }
}
document.addEventListener('click', (e) => {
  const b=e.target.closest('[data-a]'); if (!b) return;
  const a=b.dataset.a; if (a==='noop') return;
  if (a.startsWith('skin:')) { GLOBAL=a.slice(5); renderAll(); return; }
  const el=b.closest('.phone'); if (!el) return; const s=phones[+el.dataset.id];
  if (s.pending) return;
  s.demo=false;
  act(el,s,a,b);
});
// searching a long subscription opens the regions that have a match
document.addEventListener('input',(e)=>{
  const inp=e.target.closest('[data-nsearch]'); if (!inp) return;
  const el=inp.closest('.phone'), s=phones[+el.dataset.id], q=inp.value.trim().toLowerCase();
  el.querySelectorAll(`.prov[data-prov="${inp.dataset.nsearch}"] .rgrp`).forEach(g=>{
    const key=g.dataset.rg; if (q) fillGroup(g,key);
    let hits=0; g.querySelectorAll('.nrow').forEach(r=>{ const m=!q||r.dataset.n.includes(q); r.style.display=m?'':'none'; hits+=m; });
    g.style.display=q&&!hits?'none':'';
    const open=q?hits>0:!!(s.pgs&&s.pgs[key]); g.classList.toggle('open',open); g.querySelector('.acc').classList.toggle('open',open);
  });
});
// pull an expanded cell's header down to fold it
let drag=null;
document.addEventListener('pointerdown',(e)=>{ const h=e.target.closest('[data-drag]'); if (h&&!e.target.closest('button')) drag={y:e.clientY,el:h.closest('.phone')}; });
document.addEventListener('pointerup',(e)=>{ if (drag&&e.clientY-drag.y>32) { const s=phones[+drag.el.dataset.id]; s.demo=false; act(drag.el,s,'collapse'); } drag=null; });

// the phone that plays by itself, while it's on screen
const SCRIPT=[{x:'routes'},{x:'routes',sub:'ai'},{pick:['ai','东京 01']},{pick:['ai','洛杉矶 VPS']},{x:null},{x:'hero'},{x:'mode'},{x:'speed'},{x:'map'},{x:null},{mode:'global'},{mode:'rule'}];
function tick(el,s,i) {
  if (!s.demo) return;
  const canv=el.querySelector('.map-cv');
  if (canv&&VISIBLE.has(canv)) {
    const st=SCRIPT[i%SCRIPT.length]; i++;
    if (st.mode) morph(el,()=>{s.mode=st.mode;renderOne(el);});
    else if (st.pick) { const r=s.routes.find(x=>x.id===st.pick[0]); morph(el,()=>{r.node=st.pick[1];r.auto=false;s.pending='node:ai';renderOne(el);}); setTimeout(()=>{s.pending=null;renderOne(el);},700*SLOW); }
    else morph(el,()=>{s.x=st.x;s.sub=st.sub||null;renderOne(el);});
  }
  setTimeout(()=>tick(el,s,i),1900*SLOW);
}

function ctl() {
  const mk=(host,items,cur,fn)=>{ const h=document.getElementById(host); [...h.querySelectorAll('button')].forEach(x=>x.remove()); items.forEach(([v,l])=>{ const b=document.createElement('button'); b.textContent=l; if(v===cur) b.className='on'; b.onclick=()=>fn(v); h.appendChild(b); }); };
  mk('c-skin',Object.entries(SKINS).map(([k,s])=>[k,s.name]),GLOBAL,v=>{GLOBAL=v;renderAll();});
  mk('c-app',[[false,'浅色'],[true,'深色']],DARK,v=>{DARK=v;renderAll();});
  mk('c-os',[['ios','iOS'],['android','Android']],OS,v=>{OS=v;renderAll();});
  mk('c-reach',[[false,'关'],[true,'开']],document.body.classList.contains('reach'),v=>{document.body.classList.toggle('reach',v);ctl();});
  mk('c-slow',[[1,'正常'],[4,'慢放 4 倍']],SLOW,v=>{SLOW=v;document.documentElement.style.setProperty('--slow',v);ctl();});
}
renderAll();
phones.forEach((s,i)=>{ if (s.demo) { const el=document.querySelector(`.phone[data-id="${i}"]`); setTimeout(()=>tick(el,s,0),1200); } });
</script>
</body>
