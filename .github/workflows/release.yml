# Pushing a tag such as v0.1.0 builds, signs and notarizes the disk image and
# publishes it as a GitHub release. The tag must match the version in mygo.json.
#
# Running this workflow by hand builds with an ad hoc signature and publishes
# nothing, which checks that the app still builds on the runner.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # Compiling the Icon Composer app icon needs Xcode 26 or later.
    runs-on: macos-26
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check the tag and the signing secrets
        if: env.PUBLISH == 'true'
        env:
          TAG: ${{ github.ref_name }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          version="$(jq -r .version mygo.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in mygo.json"
            exit 1
          fi
          missing=0
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              missing=1
            fi
          done
          exit "$missing"

      - name: Fetch the mihomo core and geo data
        run: ./scripts/fetch-core.sh

      - name: Import the Developer ID certificate
        if: env.PUBLISH == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"

      - name: Build, sign and notarize
        if: env.PUBLISH == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          export NOTARY_KEY="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$NOTARY_KEY"
          ./scripts/release.sh
          rm "$NOTARY_KEY"

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" build/darwin-arm64/bowel-*-arm64.dmg --verify-tag --generate-notes --title "bowel $TAG"

      - name: Build without publishing
        if: env.PUBLISH != 'true'
        run: go tool mygo build -platform darwin/arm64 -skip-notarize -sign - .
