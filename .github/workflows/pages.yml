# Builds the website in site/ and its docs from docs/ (scripts/build-site.py) and publishes it to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/build-site.py"
      - "scripts/site_docs.py"
      - "scripts/site-requirements.txt"
      - "scripts/site-i18n.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r scripts/site-requirements.txt
          "$RUNNER_TEMP/venv/bin/python" scripts/build-site.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

      - id: deploy
        uses: actions/deploy-pages@v5
